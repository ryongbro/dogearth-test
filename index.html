<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DogEarth · 실제 지도 테스트</title>
<script>/* 새 버전이 있으면 자동으로 새로고침 */(()=>{const B='19';fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=(v||'').trim();if(v&&v!==B&&!sessionStorage.getItem('de.rl'+v)){sessionStorage.setItem('de.rl'+v,1);location.replace(location.pathname+'?v='+v)}}).catch(()=>{})})();</script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#f4f5f7;--card:rgba(255,255,255,.94);--line:#e3e6eb;--tx:#141619;--sub:#6b7280;--blue:#2D55E8;--blue2:#5b7cff;--orange:#E0782A;--red:#e5484d;--green:#2fb36d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
.maplibregl-ctrl-scale{background:rgba(255,255,255,.8);font-size:10px;border-color:#555}
.maplibregl-ctrl-top-left{top:calc(env(safe-area-inset-top) + 60px);left:2px}
.maplibregl-ctrl-attrib{font-size:9px}
.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:500;display:flex;gap:8px;align-items:center}
.brand,.gps,.ibtn{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.brand{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;letter-spacing:-.2px;backdrop-filter:blur(8px)}
.brand b{color:var(--blue2)}
.gps{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.dot.ok{background:var(--green)}.dot.mid{background:#e3b341}.dot.bad{background:var(--red)}
.sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:18px;display:grid;place-items:center}
.panel{box-shadow:0 6px 24px rgba(0,0,0,.12);position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:500;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px;backdrop-filter:blur(10px);transition:all .25s}
.stats{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:4px;text-align:center;align-items:end}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;text-align:left}
.big small{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.st b{display:block;font-size:16px;font-weight:700}
.st span{font-size:11px;color:var(--sub)}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;height:44px;border-radius:14px;border:0;font-size:16px;font-weight:700;color:#fff;background:var(--blue)}
.btn.sec{background:#eceef2;color:var(--tx)}
.btn.stop{background:var(--red)}
.btn.go{background:var(--green)}
.note{display:none;font-size:11.5px;color:var(--red);margin-top:6px;text-align:center;line-height:1.45}.note.show{display:block}
body.full .panel{left:auto;right:10px;padding:8px 14px;border-radius:14px;cursor:pointer}body.full .row,body.full .st{display:none}body.full .stats{display:block}body.full .big{font-size:18px}body.full .big::after{content:" ▲";font-size:11px;color:var(--sub)}
@media (max-width:430px){.brand{display:none}.top{gap:6px}.ibtn{width:36px;height:36px;font-size:16px}.brand{padding:7px 10px;font-size:15px}#gtxt{display:none}.gps{padding:9px}}
.tiltc{position:fixed;right:8px;top:50%;transform:translateY(-60%);z-index:520;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;padding:8px 4px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tiltc span{font-size:14px}.tiltc b{font-size:10px;color:var(--sub);font-weight:600}
.tiltc input{writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;appearance:slider-vertical;width:22px;height:120px;margin:0;accent-color:#2D55E8}
body.paged .tiltc,body.full .tiltc{display:none}
.ibtn.on{background:#2D55E8;color:#fff;border-color:#2D55E8}
.sheet{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.5);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 12px;font-size:18px}
.day{border-top:1px solid var(--line);padding:12px 0}
.day h4{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:600}
.walk{display:flex;align-items:center;gap:10px;padding:8px 0}
.walk .m{flex:1}
.walk .m b{font-size:15px}
.walk .m div{font-size:12px;color:var(--sub)}
.chip{padding:7px 10px;border-radius:10px;background:#eceef2;color:var(--tx);border:0;font-size:12.5px}
.chip.r{color:#d93036}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 14px}
.sum div{background:#f3f4f6;border-radius:14px;padding:12px}
.sum b{display:block;font-size:22px}
.sum span{font-size:12px;color:var(--sub)}
.me{width:22px;height:22px;border-radius:50%;background:var(--blue2);border:3px solid #fff;box-shadow:0 0 0 6px rgba(91,124,255,.25),0 2px 8px rgba(0,0,0,.5)}
.paw{font-size:14px;opacity:.75}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:1000;background:#141619;color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.zoom{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 62px);z-index:500;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.zoom button{width:40px;height:40px;border:0;background:transparent;color:var(--tx);font-size:22px;font-weight:500}
.zoom button+button{border-top:1px solid var(--line)}
.zoom .lv{font-size:10px;color:var(--sub);text-align:center;padding:2px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand">Dog<b>Earth</b></div>
  <div class="gps"><span class="dot" id="gdot"></span><span id="gtxt">GPS 대기</span></div>
  <div class="sp"></div>
  <button class="ibtn" id="bCenter" title="내 위치 · 진행 방향">◎</button>
  <button class="ibtn" id="bFull" title="지도 전체 보기">⤢</button>
  <button class="ibtn" id="bHist" title="기록" style="display:none">☰</button>
</div>
<div class="zoom" style="display:none"><button id="zIn">+</button><button id="zOut">−</button><div class="lv" id="zLv">17</div></div>

<div class="panel">
  <div class="stats">
    <div class="big"><span id="vKm">0.00</span><small>km</small></div>
    <div class="st"><b id="vTime">0:00</b><span>시간</span></div>
    <div class="st"><b id="vPace">–'––"</b><span>페이스 /km</span></div>
    <div class="st"><b id="vSteps">0</b><span>걸음 · 🐾 <span id="vPaw">0</span></span></div>
  </div>
  <div class="row" id="ctl"></div>
  <div class="note" id="note">산책 시작을 누르면 GPS 기록이 시작됩니다. 위치는 이 폰에만 저장되고 누구에게도 공유되지 않습니다.</div>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{
// ───── 저장소 ─────
const KEY='de.walks.v1', CUR='de.cur.v1';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('저장 공간 부족')}};
let walks=load(KEY,[]);           // [{id,start,end,dist,moving,pts:[[lat,lng,t]]}]
let cur=load(CUR,null);           // 진행 중 산책(새로고침 대비)

// ───── 지도 ─────
const PITCH=(()=>{try{const v=JSON.parse(localStorage.getItem('de.pitch2'));return v||{north:0,head:50}}catch(e){return{north:0,head:50}}})();let NORTH_PITCH=PITCH.north,HEAD_PITCH=PITCH.head;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[126.978,37.5665],zoom:17,pitch:NORTH_PITCH,bearing:0,maxPitch:70,touchPitch:true,dragRotate:true,minZoom:12,maxZoom:19.5,attributionControl:{compact:true}});
map.addControl(new maplibregl.ScaleControl({unit:'metric',maxWidth:80}),'top-left');
const LL=a=>[a[1],a[0]];
const EMPTY={type:'FeatureCollection',features:[]};
const pend={};let styleReady=false;
function setData(id,fc){pend[id]=fc;if(styleReady&&map.getSource(id))map.getSource(id).setData(fc)}
const lineFC=lines=>({type:'FeatureCollection',features:lines.filter(l=>l.length>1).map(l=>({type:'Feature',geometry:{type:'LineString',coordinates:l.map(LL)},properties:{}}))});
map.on('load',()=>{
  try{map.setPaintProperty('building-3d','fill-extrusion-color','#e9e5df');map.setPaintProperty('building-3d','fill-extrusion-opacity',.88);
   map.setPaintProperty('building-3d','fill-extrusion-height',['max',['coalesce',['get','render_height'],0],7])}catch(e){}
  map.getStyle().layers.forEach(l=>{if(l.type!=='symbol')return;const tf=map.getLayoutProperty(l.id,'text-field');if(tf&&JSON.stringify(tf).includes('name:latin'))map.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ko'],['get','name:nonlatin'],['get','name']])});
  ['acc','today','live','view','viewpts'].forEach(id=>map.addSource(id,{type:'geojson',data:pend[id]||EMPTY}));
  map.addLayer({id:'acc',type:'fill',source:'acc',paint:{'fill-color':'#5b7cff','fill-opacity':.1}});
  map.addLayer({id:'today',type:'line',source:'today',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#E0782A','line-width':4,'line-opacity':.6,'line-dasharray':[.2,2]}});
  map.addLayer({id:'live',type:'line',source:'live',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2D55E8','line-width':6,'line-opacity':.95}});
  map.addLayer({id:'view',type:'line',source:'view',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#E0782A','line-width':6}});
  map.addLayer({id:'viewpts',type:'circle',source:'viewpts',paint:{'circle-radius':6,'circle-color':['get','c'],'circle-stroke-color':'#fff','circle-stroke-width':2}});
  styleReady=true;window.DEX&&DEX.onMapReady&&DEX.onMapReady()});
map.on('zoom',()=>{document.getElementById('zLv').textContent=(Math.round(map.getZoom()*2)/2)});
let meMarker=null, follow=true, liveCoords=[];
let touchN=0,touchEnd=0;const mc=document.getElementById('map');
mc.addEventListener('touchstart',e=>{touchN=e.touches.length},{passive:true,capture:true});
mc.addEventListener('touchmove',e=>{touchN=Math.max(touchN,e.touches.length)},{passive:true,capture:true});
mc.addEventListener('touchend',e=>{if(!e.touches.length){touchN=0;touchEnd=Date.now()}},{passive:true,capture:true});
mc.addEventListener('wheel',()=>{touchEnd=Date.now()+300},{passive:true});
const userBusy=()=>touchN>0||Date.now()-touchEnd<350;
map.on('dragstart',e=>{if(touchN<2)follow=false});

function circlePoly(c,r){const pts=[];for(let i=0;i<=40;i++){const a=i/40*2*Math.PI,dy=r*Math.cos(a)/111320,dx=r*Math.sin(a)/(111320*Math.cos(c[0]*Math.PI/180));pts.push([c[1]+dx,c[0]+dy])}return{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Polygon',coordinates:[pts]},properties:{}}]}}
function fitPts(pts,extra){if(!pts.length)return;let a=[1e9,1e9],b=[-1e9,-1e9];pts.forEach(p=>{a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);b[0]=Math.max(b[0],p[0]);b[1]=Math.max(b[1],p[1])});
  const ph=document.querySelector('.panel').getBoundingClientRect();map.fitBounds([[a[1],a[0]],[b[1],b[0]]],Object.assign({padding:{top:90,bottom:innerHeight-ph.top+30,left:40,right:60},maxZoom:18.5,duration:700},extra||{}))}

// ───── 유틸 ─────
const $=id=>document.getElementById(id);
const R=6371000, rad=d=>d*Math.PI/180;
function hav(a,b){const dLat=rad(b[0]-a[0]),dLng=rad(b[1]-a[1]);const x=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const pad=n=>String(n).padStart(2,'0');
function fmtT(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`}
function fmtPace(sec,m){if(m<50)return "–'––\"";const p=sec/(m/1000);if(!isFinite(p)||p>3600)return "–'––\"";return `${Math.floor(p/60)}'${pad(Math.round(p%60))}"`}
const dayKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const STEP=0.7, STRIDE=0.45; // 사람 보폭 0.7m, 중형견 보폭 약 0.45m(발 4개)
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

// ───── 오늘 이전 산책 표시 ─────
function drawToday(){const k=dayKey(Date.now());setData('today',lineFC(walks.filter(w=>dayKey(w.start)===k).map(w=>w.pts)))}

// ───── GPS ─────
let watchId=null,lastFix=null,paused=false,wake=null,tick=null;
function setGps(acc){
  const d=$('gdot'),t=$('gtxt');
  if(acc==null){d.className='dot';t.textContent='GPS 대기';return}
  d.className='dot '+(acc<=15?'ok':acc<=35?'mid':'bad');
  t.textContent=`±${Math.round(acc)}m`;
}
function onPos(p){
  const {latitude:lat,longitude:lng,accuracy:acc}=p.coords, t=p.timestamp||Date.now();
  setGps(acc); lastFix=[lat,lng,t];
  const ll=[lat,lng];
  if(!meMarker){const el=document.createElement('div');el.className='me';meMarker=new maplibregl.Marker({element:el,pitchAlignment:'map'}).setLngLat(LL(ll)).addTo(map);map.jumpTo({center:LL(ll),zoom:17.5})}
  else meMarker.setLngLat(LL(ll));
  setData('acc',circlePoly(ll,Math.min(acc,80)));
  if(lastC){const dd=hav(lastC,ll);if(dd>6&&acc<35){course=brg(lastC,ll);lastC=ll;movedAt=Date.now()}}else lastC=ll;
  if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>0.6){course=p.coords.heading;movedAt=Date.now()}
  window.DEX&&DEX.onFix&&DEX.onFix(lat,lng,acc,t);
  if(!cur||paused)return;
  // 노이즈 필터: 정확도 40m 초과 무시, 3m 미만 이동 무시, 초속 8m 초과 튐 무시
  if(acc>40)return;
  const pts=cur.pts,last=pts[pts.length-1];
  if(last){
    const d=hav(last,ll),dt=(t-last[2])/1000;
    if(d<Math.max(3,acc*0.4))return;
    if(dt>0&&d/dt>8)return;
    cur.dist+=d;
  }
  pts.push([+lat.toFixed(6),+lng.toFixed(6),t]);
  liveCoords.push(ll);setData('live',lineFC([liveCoords]));
  save(CUR,cur);
  render();
}
function onErr(e){
  if(e.code!==1&&lastFix&&Date.now()-lastFix[2]<60000)return;
  setGps(null);
  const m={1:'위치 권한이 거부되었습니다. 설정 › 개인정보 › 위치 서비스에서 브라우저를 "앱을 사용하는 동안"으로 허용해 주세요.',2:'위치를 찾을 수 없습니다. 실외에서 다시 시도해 주세요.',3:'위치 응답이 늦습니다. 잠시 기다려 주세요.'}[e.code]||'위치 오류';
  $('note').textContent=m;$('note').classList.add('show');
}
function startGps(){$('note').classList.remove('show');
  if(!('geolocation' in navigator)){$('note').textContent='이 브라우저는 위치 기능을 지원하지 않습니다.';return}
  if(watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
async function lockOn(){try{if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen')}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(cur&&!paused)lockOn();}});

// ───── 산책 제어 ─────
function elapsed(){if(!cur)return 0;let ms=cur.moving+(paused?0:Date.now()-cur.resumeAt);return ms/1000}
function render(){
  const s=elapsed(),m=cur?cur.dist:0;
  $('vKm').textContent=(m/1000).toFixed(2);
  $('vTime').textContent=fmtT(s);
  $('vPace').textContent=fmtPace(s,m);
  $('vSteps').textContent=Math.round(m/STEP).toLocaleString();
  $('vPaw').textContent=Math.round(m/STRIDE*4).toLocaleString();
  const c=$('ctl');
  if(!cur){c.innerHTML='<button class="btn" id="bStart">산책 시작</button>';$('bStart').onclick=()=>window.DEX&&DEX.beforeStart?DEX.beforeStart(start):start()}
  else if(paused){c.innerHTML='<button class="btn go" id="bRes">계속</button><button class="btn stop" id="bEnd">종료</button>';$('bRes').onclick=resume;$('bEnd').onclick=end}
  else{c.innerHTML='<button class="btn sec" id="bPause">일시정지</button><button class="btn stop" id="bEnd">종료</button>';$('bPause').onclick=pause;$('bEnd').onclick=end}
}
function start(){
  startGps();
  cur={id:Date.now().toString(36),start:Date.now(),dist:0,moving:0,resumeAt:Date.now(),pts:[]};
  if(lastFix&&Date.now()-lastFix[2]<15000)cur.pts.push(lastFix);
  liveCoords=cur.pts.map(p=>[p[0],p[1]]);setData('live',lineFC([liveCoords]));
  paused=false;follow=true;save(CUR,cur);lockOn();
  clearInterval(tick);tick=setInterval(render,1000);
  $('note').textContent='화면이 켜져 있는 동안 기록됩니다. 화면을 끄거나 다른 앱으로 가면 기록이 멈출 수 있어요.';
  render();toast('산책을 시작했어요 🐕');setNav('head',false);window.DEX&&DEX.onStart&&DEX.onStart();
}
function pause(){cur.moving+=Date.now()-cur.resumeAt;paused=true;cur.paused=true;save(CUR,cur);render();toast('일시정지')}
function resume(){cur.resumeAt=Date.now();paused=false;cur.paused=false;save(CUR,cur);lockOn();render()}
function end(){
  if(!paused)cur.moving+=Date.now()-cur.resumeAt;
  const w={id:cur.id,start:cur.start,end:Date.now(),dist:Math.round(cur.dist),moving:Math.round(cur.moving/1000),pts:cur.pts};
  clearInterval(tick);
  try{wake&&wake.release()}catch(e){};wake=null;
  if(window.DEX&&DEX.onEnd)DEX.onEnd(w);
  if(w.pts.length>=2&&w.dist>=20){walks.push(w);save(KEY,walks);showSummary(w)}
  else toast('이동 거리가 너무 짧아 저장하지 않았어요');
  cur=null;paused=false;localStorage.removeItem(CUR);
  liveCoords=[];setData('live',EMPTY);drawToday();render();
  $('note').textContent='기록은 이 폰의 브라우저에만 저장됩니다. ☰ 에서 날짜별 기록과 GPX 내보내기를 볼 수 있어요.';
}

// ───── 요약 / 기록 ─────
function openSheet(html){$('sheetIn').innerHTML=html;$('sheet').classList.add('on')}
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on')};
function showSummary(w){
  openSheet(`<h3>산책 완료 🎉</h3>
  <div class="sum">
    <div><b>${(w.dist/1000).toFixed(2)} km</b><span>거리</span></div>
    <div><b>${fmtT(w.moving)}</b><span>시간</span></div>
    <div><b>${fmtPace(w.moving,w.dist)}</b><span>평균 페이스</span></div>
    <div><b>${Math.round(w.dist/STEP).toLocaleString()}</b><span>걸음 · 🐾 ${Math.round(w.dist/STRIDE*4).toLocaleString()}</span></div>
  </div>
  ${w.events&&w.events.length&&window.DEX&&DEX.evSummary?`<div style="margin:-4px 0 12px;font-size:14px;color:var(--sub);text-align:left">${DEX.evSummary(w.events)}</div>`:''}
  <div class="row"><button class="btn sec" onclick="DE.gpx('${w.id}')">GPX 저장</button><button class="btn" onclick="DE.close()">확인</button></div>`);
  showWalk(w,false);
}
function clearView(){setData('view',EMPTY);setData('viewpts',EMPTY)}
function showWalk(w){
  const ll=w.pts.map(p=>[p[0],p[1]]);setData('view',lineFC([ll]));
  setData('viewpts',{type:'FeatureCollection',features:[[ll[0],'#2fb36d'],[ll[ll.length-1],'#e5484d']].map(([p,c])=>({type:'Feature',geometry:{type:'Point',coordinates:LL(p)},properties:{c}}))});
  follow=false;fitPts(ll,{bearing:0,pitch:NORTH_PITCH});
}
function history(){
  const by={};walks.slice().reverse().forEach(w=>{(by[dayKey(w.start)]=by[dayKey(w.start)]||[]).push(w)});
  const days=Object.keys(by);
  const tot=walks.reduce((a,w)=>a+w.dist,0);
  let h=`<h3>산책 기록</h3><div class="sum"><div><b>${walks.length}회</b><span>전체 산책</span></div><div><b>${(tot/1000).toFixed(1)} km</b><span>누적 거리</span></div></div>`;
  if(!days.length)h+='<div class="note">아직 저장된 산책이 없어요.</div>';
  days.forEach(d=>{
    const list=by[d],dd=list.reduce((a,w)=>a+w.dist,0);
    h+=`<div class="day"><h4>${d.replace(/-/g,'.')} · ${list.length}회 · ${(dd/1000).toFixed(2)} km</h4>`;
    list.forEach(w=>{h+=`<div class="walk"><div class="m"><b>${(w.dist/1000).toFixed(2)} km</b><div>${hm(w.start)}–${hm(w.end)} · ${fmtT(w.moving)} · ${fmtPace(w.moving,w.dist)}</div></div>
      <button class="chip" onclick="DE.view('${w.id}')">지도</button><button class="chip" onclick="DE.gpx('${w.id}')">GPX</button><button class="chip r" onclick="DE.del('${w.id}')">삭제</button></div>`});
    h+='</div>';
  });
  openSheet(h);
}
function gpx(id){
  const w=walks.find(x=>x.id===id);if(!w)return;
  const seg=w.pts.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(p[2]).toISOString()}</time></trkpt>`).join('');
  const x=`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="DogEarth" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>DogEarth ${dayKey(w.start)} ${hm(w.start)}</name><trkseg>${seg}</trkseg></trk></gpx>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/gpx+xml'}));
  a.download=`dogearth-${dayKey(w.start)}-${hm(w.start).replace(':','')}.gpx`;document.body.appendChild(a);a.click();a.remove();
}
window.DEX=window.DEX||{};Object.defineProperties(DEX,Object.getOwnPropertyDescriptors({map,LL,hav,setNav:(m,say)=>setNav(m,say),get cur(){return cur},get paused(){return paused},get lastFix(){return lastFix},get follow(){return follow},set follow(v){follow=v},toast,openSheet,walks:()=>walks,showWalk}));
window.DE={
  close:()=>{$('sheet').classList.remove('on')},
  view:id=>{const w=walks.find(x=>x.id===id);if(w){$('sheet').classList.remove('on');showWalk(w)}},
  gpx,
  del:id=>{if(!confirm('이 산책 기록을 삭제할까요? 되돌릴 수 없어요.'))return;walks=walks.filter(x=>x.id!==id);save(KEY,walks);clearView();drawToday();history()}
};
$('bHist').onclick=history;
$('zIn').onclick=()=>map.zoomIn(1);$('zOut').onclick=()=>map.zoomOut(1);
$('bCenter').onclick=()=>{clearView();if(!lastFix){startGps();return}
  setNav(nav==='north'?'head':'north',true)};
function setNav(m,say){follow=true;if(document.body.classList.contains('full'))setFull(false);nav=m;
  if(m==='head'){$('bCenter').textContent='➤';$('bCenter').classList.add('on');if(course!=null)navB=course;else navB=map.getBearing();askCompass();if(say)toast('진행 방향 보기 — 가는 쪽이 위로 와요')}
  else{$('bCenter').textContent='◎';$('bCenter').classList.remove('on');navB=0;if(say)toast('북쪽 고정 보기')}
  const p=lastFix?LL(lastFix):map.getCenter().toArray();easing=Date.now()+900;map.easeTo({center:p,bearing:navB,pitch:PITCH[m],padding:padFor(),duration:800})}
let easing=0;
$('bFull').onclick=()=>{const on=!document.body.classList.contains('full');setFull(on)};
document.querySelector('.panel').addEventListener('click',e=>{if(document.body.classList.contains('full')){e.stopPropagation();setFull(false)}},true);
function setFull(on){document.body.classList.toggle('full',on);$('bFull').classList.toggle('on',on);follow=false;
  if(on){const pts=[];walks.filter(w=>dayKey(w.start)===dayKey(Date.now())).forEach(w=>w.pts.forEach(p=>pts.push([p[0],p[1]])));if(cur)cur.pts.forEach(p=>pts.push([p[0],p[1]]));if(lastFix)pts.push([lastFix[0],lastFix[1]]);
   setTimeout(()=>{if(pts.length>1)fitPts(pts,{bearing:0,pitch:20});else map.easeTo({zoom:Math.max(14,map.getZoom()-2),bearing:0,pitch:20,padding:{top:0,bottom:0,left:0,right:0}})},260)}
  else if(lastFix)setNav(nav,false)}
// ---- 진행 방향 · 따라가기 ----
function savePitch(v){PITCH[nav]=Math.round(v);try{localStorage.setItem('de.pitch2',JSON.stringify(PITCH))}catch(e){}const r=document.getElementById('tilt');if(r&&+r.value!==PITCH[nav])r.value=PITCH[nav];const l=document.getElementById('tiltv');if(l)l.textContent=PITCH[nav]+'°'}
map.on('pitchend',e=>{if(e.originalEvent||e.fromSlider)savePitch(map.getPitch())});
document.body.insertAdjacentHTML('beforeend',`<div class="tiltc" style="display:none"><span>⛰</span><input type="range" id="tilt" min="0" max="70" step="1" value="${PITCH.north}" aria-label="지도 기울기"><b id="tiltv">${PITCH.north}°</b></div>`);
{const r=document.getElementById('tilt');r.addEventListener('input',()=>{map.setPitch(+r.value);document.getElementById('tiltv').textContent=r.value+'°'});r.addEventListener('change',()=>savePitch(+r.value));
 ['touchstart','pointerdown'].forEach(ev=>r.addEventListener(ev,e=>e.stopPropagation(),{passive:true}))}
map.on('pitch',()=>{const r=document.getElementById('tilt');if(r&&document.activeElement!==r){r.value=Math.round(map.getPitch());document.getElementById('tiltv').textContent=Math.round(map.getPitch())+'°'}});
let zooming=false;map.on('zoomstart',e=>{if(e.originalEvent)zooming=true});map.on('zoomend',()=>setTimeout(()=>zooming=false,150));
let nav='north',course=null,lastC=null,movedAt=0,compass=null,navB=0;
function brg(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360}
function askCompass(){const on=()=>addEventListener('deviceorientation',e=>{const h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?360-e.alpha:null);if(h!=null)compass=h},true);
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')on()}).catch(()=>{});else on()}catch(e){}}
function padFor(){const pt=document.querySelector('.panel').getBoundingClientRect().top,bot=innerHeight-pt,top=70,avail=pt-top;return nav==='head'?{top:top+avail*.42,bottom:bot,left:0,right:0}:{top,bottom:bot,left:0,right:0}}
function placeFollow(ll,anim){if(Date.now()<easing||map.isMoving&&map.isMoving()&&anim===undefined)return;const o={center:LL(ll),padding:padFor()};if(nav==='head')o.bearing=navB;if(anim)map.easeTo(Object.assign(o,{duration:500}));else map.jumpTo(o)}
let nlt=performance.now();
(function navLoop(n){const dt=Math.min(.1,(n-nlt)/1000);nlt=n;
  if(nav==='head'){const still=Date.now()-movedAt>6000;const hd=(still&&compass!=null)?compass:course;if(hd!=null){let df=((hd-navB)%360+540)%360-180;if(Math.abs(df)>.3)navB+=df*Math.min(1,dt*2.2)}}
  const d=(window.DEX&&DEX.disp)||lastFix;if(follow&&d&&!userBusy()&&Date.now()>easing&&!document.body.classList.contains('full'))placeFollow(d,false);
  requestAnimationFrame(navLoop)})(performance.now());

// ───── 시작 ─────
drawToday();
if(cur){ // 새로고침 후 이어가기
  paused=!!cur.paused; if(!paused)cur.resumeAt=Date.now();
  liveCoords=cur.pts.map(p=>[p[0],p[1]]);setData('live',lineFC([liveCoords]));
  startGps();lockOn();tick=setInterval(render,1000);toast('진행 중이던 산책을 이어갑니다');
}else startGps();
render();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="dogkit.js?v=13"></script>
<script src="extras-ml.js?v=19"></script>
<script src="app.js?v=19"></script>
</body>
